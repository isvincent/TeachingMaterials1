<!DOCTYPE html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摩擦力｜5 分鐘互動物理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050f18;color:#e9f1ee;font-family:system-ui,"Noto Sans TC",sans-serif;display:grid;place-items:center;min-height:100vh}button,input,select{font:inherit}button,select{cursor:pointer;color:inherit;background:#19303b;border:1px solid #41616b;border-radius:12px;padding:10px 14px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eab267}#stage{position:relative;width:min(100vw,56.25vh);aspect-ratio:9/16;background:radial-gradient(ellipse at top right,#193e42,transparent 60%),#0b1e28;overflow:hidden;container-type:inline-size;box-shadow:0 0 70px #0009}#inner{height:100%;padding:5cqw;display:flex;flex-direction:column;gap:2cqw}.eyebrow{font-size:2.8cqw;letter-spacing:.16em;color:#8cadb4;display:flex;justify-content:space-between}h1{font-size:7cqw;line-height:1.22;margin:3cqw 0 0;letter-spacing:-.04em}#sub{font-size:3.4cqw;color:#a9c7c8;margin:0}.rule{width:13cqw;height:1cqw;background:#ecb366}#visual{height:44cqw;flex-shrink:0;border-radius:3cqw;background:#102a35;border:1px solid #284951;position:relative;overflow:hidden}svg{width:100%;height:100%}svg text{font-family:inherit;fill:#d9e9e8;font-size:19px}#formula{font-size:3.3cqw;line-height:1.6;color:#f1c381;min-height:11cqw;display:flex;align-items:center}#lab{min-height:15cqw;background:#14323b;border-left:3px solid #72d5c6;padding:2.4cqw;border-radius:1cqw;font-size:3.1cqw}input[type=range]{width:100%;accent-color:#77daca}#readout{color:#80dfcd;font-size:3.1cqw;margin-top:1cqw}#caption{font-size:4.7cqw;line-height:1.65;min-height:17cqw;display:flex;align-items:center;border-top:1px solid #31505a;padding-top:2cqw}footer{margin-top:auto;font-size:2.8cqw;color:#a7bfc5}#controls{display:flex;gap:1cqw;align-items:center;margin-top:2cqw}#controls button{font-size:3cqw;padding:1.8cqw 2.2cqw}#seek{margin-top:2cqw}#chapters{width:100%;font-size:2.8cqw;padding:1.4cqw;margin-top:1.5cqw}#overlay{position:absolute;inset:0;background:#061722ed;display:flex;align-items:center;justify-content:center;z-index:5;padding:8cqw;text-align:center}#overlay h2{font-size:9cqw;margin:0 0 5cqw}#overlay p{font-size:3.7cqw;line-height:1.8;color:#a9c7c8}#start{font-size:4cqw;background:#edbd77;color:#10222b;border:0;padding:3cqw 5cqw}#slide{display:contents}.enter{animation:enter .65s ease both}@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}#notice{font-size:2.5cqw;color:#a0bdc2;min-height:3cqw}.paused *{animation-play-state:paused!important}.paused .enter{animation:none!important;opacity:1;transform:none}@media(prefers-reduced-motion:reduce){.enter,.pulse{animation:none}}
</style>
<div id="stage" aria-label="1080 × 1920 直式物理簡報"><div id="inner"><div class="eyebrow"><span>PHYSICS / FRICTION</span><span id="number"></span></div><div class="rule"></div><h1 id="title"></h1><p id="sub"></p><div id="visual"></div><div id="formula"></div><div id="lab"></div><div id="caption" aria-live="polite"></div><footer><div id="notice">預設中文語音 · 中等語速</div><div id="controls"><button id="play" aria-label="播放或暫停">暫停</button><button id="mute">旁白：開</button><button id="restart">重播</button><span id="time"></span></div><input id="seek" aria-label="播放進度，秒" type="range" min="0" max="300" step=".1" value="0"><select id="chapters" aria-label="選擇段落"></select><div style="margin-top:1.5cqw">教材：高中選修物理 2，2-2 摩擦力，p.60–65</div></footer></div><div id="overlay"><div><div class="eyebrow">5 MINUTE PHYSICS</div><h2>摩擦力<br><span style="color:#edbd77">看得見的力</span></h2><p>12 段動畫 · 300 秒教學<br>拖動滑桿，親自測試推力與斜面<br>點擊啟動預設語音與自動播放</p><button id="start">▶ 開始 5 分鐘教學</button><p>9:16 · 1080 × 1920 比例<br>可暫停、跳轉、關閉旁白</p></div></div></div>
<script>
const slides=[{"title":"推不動，力去哪了？","sub":"從一只箱子，看懂摩擦力","formula":"fs = F，合力 = 0","type":"flat","cues":["用力推箱子，箱子卻沒有移動。","沒有加速度，表示水平合力等於零。","地面給箱子向左的摩擦力，抵消推力。","兩個接觸面沒有相對滑動，就是靜摩擦。","今天用五分鐘，看懂摩擦的方向與大小。"],"start":0,"duration":25},{"title":"靜摩擦會自己調整","sub":"推力增大，摩擦力跟著增大","formula":"0 ≤ fs ≤ μsN","type":"flat","cues":["箱子仍然靜止時，靜摩擦力等於推力。","推十牛頓，靜摩擦力就是十牛頓。","推力增大，靜摩擦也會跟著調整。","但它有上限，稱為最大靜摩擦力。","拖動推力滑桿，觀察箭頭如何變化。"],"start":25,"duration":25},{"title":"跨過門檻，開始滑動","sub":"最大靜摩擦力是一個上限","formula":"fs,max = μsN","type":"graph","cues":["最大靜摩擦力，等於靜摩擦係數乘正向力。","例如正向力一百，係數零點四，上限四十牛頓。","推力超過四十牛頓，箱子開始滑動。","正向力增大，只會提高最大靜摩擦的上限。","實際靜摩擦力，仍然由平衡所需決定。"],"start":50,"duration":25},{"title":"方向，看相對運動","sub":"靜摩擦反抗滑動趨勢","formula":"接觸面沒有相對滑動 ≠ 地面上靜止","type":"bus","cues":["摩擦力的方向，沿著兩物體的接觸面。","靜摩擦力反抗的是相對滑動的趨勢。","公車向前加速，箱子有相對車廂後滑的趨勢。","地板給箱子向前的靜摩擦力，帶它一起加速。","所以受到靜摩擦的物體，也可以在地面看來移動。"],"start":75,"duration":25},{"title":"斜面：先分解重量","sub":"沿斜面與垂直斜面分開分析","formula":"fs = W sinθ　 N = W cosθ","type":"incline","cues":["把重量分成平行斜面，和垂直斜面的分量。","沿斜面向下的分量，是重量乘正弦角度。","垂直斜面的分量，是重量乘餘弦角度。","沒有其他垂直斜面的力，正向力等於後者。","物體靜止時，靜摩擦力向上抵消下滑分量。"],"start":100,"duration":25},{"title":"角度變大，何時滑？","sub":"需求增加，上限反而下降","formula":"tanθ ≤ μs；臨界角 θc = arctan μs","type":"incline","cues":["斜面越陡，向下的重力分量越大。","物體仍靜止時，實際靜摩擦力也越大。","但正向力變小，最大靜摩擦力反而下降。","兩者相等時，正切角度等於靜摩擦係數。","調高角度，找出零點四係數的臨界角，約二十二度。"],"start":125,"duration":25},{"title":"加一個向上的拉力","sub":"摩擦方向可以翻轉","formula":"W sinθ − μsW cosθ ≤ F ≤ W sinθ + μsW cosθ","type":"range","cues":["教材範例中，沿著斜面向上拉動物體。","拉力太小，有下滑趨勢，摩擦就沿斜面向上。","拉力太大，有上滑趨勢，摩擦改成向下。","把兩種即將滑動的條件，分別列成平衡式。","就能得到拉力的上下限，讓物體保持平衡。"],"start":150,"duration":25},{"title":"滑動後：動摩擦力","sub":"反抗接觸面的相對滑動","formula":"fk = μkN","type":"flat","cues":["接觸面已經相對滑動，就改用動摩擦力。","箱子向右滑，地面給箱子的動摩擦力向左。","大小近似等於動摩擦係數乘正向力。","教材的乾摩擦模型中，它大致不隨速度或面積改變。","一般動摩擦係數，比靜摩擦係數小。"],"start":175,"duration":25},{"title":"一張曲線，連起兩種摩擦","sub":"先隨推力增加，再降到動摩擦","formula":"μs = 0.40　 μk = 0.30　 N = 100 N","type":"graph","cues":["逐漸增加推力，先沿著斜線上升。","這一段箱子靜止，摩擦力與推力一樣大。","到達四十牛頓的最大靜摩擦後，開始滑動。","動摩擦降為三十牛頓，推力再大也近似維持。","這條曲線描述，從靜止逐漸增加推力的過程。"],"start":200,"duration":25},{"title":"兩只箱子，一起加速","sub":"地面光滑；箱子之間有摩擦","formula":"Fmax = (mA + mB) μsg = 80 N","type":"stack","cues":["上下兩箱各十公斤，地面光滑。","箱子間靜摩擦係數零點四，重力加速度取十。","上箱向前加速的力，就是下箱給它的靜摩擦。","不相對滑動時，最大共同加速度是每秒平方四公尺。","總質量二十公斤，所以最大拉力是八十牛頓。"],"start":225,"duration":25},{"title":"拉力 90 N，會怎樣？","sub":"超過門檻，兩箱相對滑動","formula":"aA = μkg = 3 m/s²","type":"stack","cues":["九十牛頓超過八十牛頓，兩箱開始相對滑動。","這時上箱受到的，是向前的動摩擦力。","動摩擦係數零點三，摩擦力等於三十牛頓。","上箱十公斤，加速度就是每秒平方三公尺。","摩擦力可以讓物體加速，方向要看相對滑動。"],"start":250,"duration":25},{"title":"帶走三個判斷","sub":"先看接觸，再看趨勢，最後算力","formula":"靜：fs ≤ μsN　｜　動：fk = μkN","type":"quiz","cues":["先判斷，接觸面是否有相對滑動。","再判斷，相對滑動或滑動趨勢的方向。","最後用平衡或牛頓第二定律，求出所需摩擦力。","鞋底需要較大摩擦，軸承則希望減少摩擦。","雨水可能降低斜坡接觸面的係數，讓土塊更容易滑下。"],"start":275,"duration":25}];
const $=id=>document.getElementById(id);let t=0,playing=false,muted=false,last=performance.now(),current=-1,cue=-1,manual=null,utterance=null;
const synth=window.speechSynthesis;
function arrow(x,y,dx,dy,color,label){return '<line x1="'+x+'" y1="'+y+'" x2="'+(x+dx)+'" y2="'+(y+dy)+'" stroke="'+color+'" stroke-width="6" marker-end="url(#'+color.slice(1)+')"/><text x="'+(x+dx+(dx<0?-40:8))+'" y="'+(y+dy-12)+'" style="fill:'+color+'">'+label+'</text>'}
function svg(content){const colors=['#efbb76','#76d7c7','#96b9ff'];return '<svg viewBox="0 0 600 350" role="img" aria-label="'+slides[Math.min(11,Math.floor(t/25))].title+'"><defs>'+colors.map(c=>'<marker id="'+c.slice(1)+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="'+c+'"/></marker>').join('')+'</defs>'+content+'</svg>'}
function box(x,y,w,h,label){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8" fill="#c99962"/><path d="M'+(x+w/2)+' '+y+'v'+h+'" stroke="#efd0a1" opacity=".5"/><text x="'+(x+w/2)+'" y="'+(y+h/2+7)+'" text-anchor="middle" style="fill:#17303a;font-weight:bold">'+label+'</text>'}
function draw(){const s=slides[current],p=(t%25)/25;let out='';
if(s.type==='flat'||s.type==='bus'){const f=manual??(s.type==='bus'?25:current===7?65:10+(current===0?25:65)*p),moving=f>40||current===7,fr=moving?30:f,x=240+(moving?70*Math.sin(p*Math.PI):0);out='<path d="M35 250H565" stroke="#74939c" stroke-width="4"/>'+box(x,155,115,90,'m')+arrow(x+115,200,f*2,0,'#efbb76','F')+arrow(x,222,-fr*2,0,'#76d7c7',moving?'fk':'fs')+arrow(x+57,155,0,-90,'#96b9ff','N')+arrow(x+57,245,0,70,'#efbb76','W');if(s.type==='bus'){out='<rect x="55" y="65" width="490" height="200" rx="20" fill="none" stroke="#638994" stroke-width="3"/>'+box(240,155,115,90,'箱子')+arrow(355,210,110,0,'#76d7c7','fs')+arrow(100,45,150,0,'#efbb76','a')+'<text x="65" y="305">車廂與箱子一起向右加速</text>'}else $('readout').textContent='F = '+f.toFixed(0)+' N ｜ '+(moving?'滑動：fk = 30 N':'靜止：fs = '+f.toFixed(0)+' N');}
else if(s.type==='graph'){const f=manual??(p*80),fr=f<=40?f:30;out='<path d="M85 35V285H550" fill="none" stroke="#7896a1" stroke-width="3"/><path d="M85 285L305 65" stroke="#76d7c7" stroke-width="6" fill="none"/><path d="M305 65V120H540" stroke="#efbb76" stroke-width="6" fill="none"/><path d="M85 65H305M85 120H540" stroke="#69828c" stroke-dasharray="7 7"/><text x="15" y="70">40</text><text x="15" y="127">30</text><text x="285" y="320">40</text><text x="440" y="320">F / N</text><text x="105" y="30">f / N</text><text x="160" y="145">靜摩擦</text><text x="390" y="105">動摩擦</text><circle cx="'+(85+f*5.5)+'" cy="'+(285-fr*5.5)+'" r="11" fill="#fff" class="pulse"/>';$('readout').textContent='推力 '+f.toFixed(0)+' N → 摩擦力 '+fr.toFixed(0)+' N';}
else if(s.type==='incline'||s.type==='range'){const theta=manual??(current===4?20:10+p*25),a=theta*Math.PI/180,n=100*Math.cos(a),f=100*Math.sin(a),slip=f>.4*n;out='<g transform="translate(90 270) rotate(-'+theta+')"><path d="M0 0H435" stroke="#90adb3" stroke-width="5"/>'+box(170+(slip? -65*p:0),-70,90,65,'m')+arrow(210,-85,100,0,'#76d7c7',slip?'fk':'fs')+arrow(210,-70,0,-100,'#96b9ff','N')+arrow(180,-35,-100,0,'#efbb76','W sinθ')+'</g><text x="65" y="325">θ = '+theta.toFixed(1)+'°</text><text x="300" y="320">'+(slip?'超過臨界角':'尚未滑動')+'</text>';$('readout').textContent='需求 '+f.toFixed(1)+' N ｜ 靜摩擦上限 '+(.4*n).toFixed(1)+' N';if(s.type==='range'){out='<text x="55" y="65">下滑趨勢</text>'+arrow(60,105,180,0,'#76d7c7','fs 向上')+'<text x="330" y="65">上滑趨勢</text>'+arrow(510,105,-160,0,'#76d7c7','fs 向下')+'<rect x="70" y="180" width="460" height="50" rx="25" fill="#76d7c733"/><path d="M70 175V240M530 175V240" stroke="#efbb76" stroke-width="4"/><text x="300" y="212" text-anchor="middle">平衡的拉力範圍</text><text x="300" y="285" text-anchor="middle">| F − W sinθ | ≤ μsW cosθ</text>'}}
else if(s.type==='stack'){const sliding=current===10,offset=sliding?p*70:p*40;out='<path d="M40 270H565" stroke="#8facb4" stroke-width="4"/>'+box(210+offset,185,170,80,'B · 10 kg')+box(230+(sliding?p*30:offset),110,125,70,'A · 10 kg')+arrow(380+offset,225,95,0,'#efbb76',sliding?'90 N':'80 N')+arrow(355+(sliding?p*30:offset),145,95,0,'#76d7c7',sliding?'fk = 30 N':'fs ≤ 40 N')+'<text x="70" y="315">'+(sliding?'A：3 m/s²　B：6 m/s²':'共同加速度 ≤ 4 m/s²')+'</text>'}
else{out='<circle cx="110" cy="90" r="35" fill="#76d7c733"/><text x="110" y="99" text-anchor="middle">1</text><text x="170" y="99">接觸面，有滑動嗎？</text><circle cx="110" cy="180" r="35" fill="#efbb7633"/><text x="110" y="189" text-anchor="middle">2</text><text x="170" y="189">相對趨勢，往哪裡？</text><circle cx="110" cy="270" r="35" fill="#96b9ff33"/><text x="110" y="279" text-anchor="middle">3</text><text x="170" y="279">合力，如何平衡？</text>'}
$('visual').innerHTML=svg(out);
}
function show(i){current=i;manual=null;$('title').textContent=slides[i].title;$('sub').textContent=slides[i].sub;$('formula').textContent=slides[i].formula;$('number').textContent=String(i+1).padStart(2,'0')+' / 12';$('chapters').value=i;['title','visual','formula'].forEach(id=>{$(id).classList.remove('enter');void $(id).offsetWidth;$(id).classList.add('enter')});const type=slides[i].type;if(['flat','graph','incline'].includes(type)){const incline=type==='incline';$('lab').innerHTML='<label for="experiment">'+(incline?'實驗 · 改變斜面角度（μs = 0.40）':'實驗 · 改變推力（N = 100 N）')+'</label><input id="experiment" type="range" min="0" max="'+(incline?40:80)+'" value="20" step="1"><div id="readout"></div>';$('experiment').oninput=e=>{pause();manual=+e.target.value;draw()}}else if(type==='quiz'){$('lab').innerHTML='概念檢查：靜摩擦力總是等於 μsN 嗎？<br><button id="answer" style="font-size:3cqw;padding:1cqw">揭曉答案</button>';$('answer').onclick=()=>{pause();$('lab').textContent='不一定！μsN 是上限，fs 由實際平衡或加速需求決定。'}}else $('lab').innerHTML='<div id="readout">'+(type==='stack'?'光滑地面 · g = 10 m/s² · μs = 0.40 · μk = 0.30':type==='range'?'摩擦方向取決於相對滑動趨勢':'靜摩擦力也能讓物體向前加速')+'</div>';draw();}
function speak(text){if(!synth||muted||!playing)return;synth.cancel();utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-TW';const voices=synth.getVoices(),v=voices.find(v=>v.default&&/^zh/.test(v.lang))||voices.find(v=>/zh[-_]TW/i.test(v.lang))||voices.find(v=>/^zh/.test(v.lang));if(v)utterance.voice=v;utterance.rate=1;utterance.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))$('notice').textContent='語音無法使用，字幕與動畫繼續播放'};synth.speak(utterance);}
function update(force=false){let i=Math.min(11,Math.floor(t/25)),local=t-i*25,total=slides[i].cues.reduce((a,x)=>a+x.length,0),sum=0,c=4;for(let j=0;j<5;j++){sum+=slides[i].cues[j].length;if(local<25*sum/total){c=j;break}}let key=i*5+c;if(i!==current)show(i);if(key!==cue||force){cue=key;$('caption').textContent=slides[i].cues[c];speak(slides[i].cues[c]);}draw();$('seek').value=t;$('time').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 5:00';}
function pause(){playing=false;if(synth)synth.cancel();$('play').textContent='播放';$('stage').classList.add('paused')}
function resume(){if(t>=300)t=0;manual=null;playing=true;last=performance.now();$('play').textContent='暫停';$('stage').classList.remove('paused');update(true);}
function jump(value){if(synth)synth.cancel();t=Math.max(0,Math.min(300,value));current=-1;cue=-1;manual=null;update(true)}
$('start').onclick=()=>{$('overlay').style.display='none';if(!synth)$('notice').textContent='此瀏覽器無語音支援；字幕可正常播放';resume()};
$('play').onclick=()=>playing?pause():resume();$('restart').onclick=()=>{jump(0);resume()};$('mute').onclick=()=>{muted=!muted;$('mute').textContent='旁白：'+(muted?'關':'開');if(synth)synth.cancel();if(!muted)update(true)};$('seek').oninput=e=>jump(+e.target.value);$('chapters').innerHTML=slides.map((s,i)=>'<option value="'+i+'">'+String(i+1).padStart(2,'0')+' · '+s.title+'</option>').join('');$('chapters').onchange=e=>jump(+e.target.value*25);document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();playing?pause():resume()}if(e.code==='ArrowRight')jump(t+5);if(e.code==='ArrowLeft')jump(t-5)});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',()=>{if(synth)synth.cancel()});
function frame(now){if(playing){t=Math.min(300,t+Math.max(0,now-last)/1000);update();if(t>=300)pause()}last=now;requestAnimationFrame(frame)}update();requestAnimationFrame(frame);
</script></html>
