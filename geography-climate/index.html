<script>
'use strict';
const lesson={"slug": "geography-climate", "subject": "地理", "title": "氣候系統", "accent": "#6edfe9", "source": "173iBeB-ACXNew29EwKmsxbgM0_JzbRk7", "pages": "教材頁 142–151", "slides": [{"title": "氣候，是互相連動的系統", "kicker": "01 / 三個核心要素", "points": ["氣溫：空氣冷暖", "氣壓與風：空氣如何移動", "降水：水氣如何回到地面"], "diagram": ["cycle", "氣溫", "氣壓與風", "降水"], "voice": "氣候要素中，氣溫、氣壓和降水最重要，而且會互相影響。地表接收太陽能，改變空氣冷暖；氣壓差讓空氣移動；潮濕空氣上升、冷卻，可能形成降水。本課從這條線索出發，理解各地氣候差異，也理解臺灣為什麼有時多雨、有時缺水。", "quiz": null}, {"title": "同一束陽光，熱量不同", "kicker": "02 / 緯度與高度", "points": ["低緯度：照射角大，熱量較集中", "高緯度：照射角小，熱量較分散", "同緯度通常愈高愈冷"], "diagram": ["latitude"], "voice": "緯度影響太陽照射角度。低緯度地區，能量集中在較小的地表面積，通常較暖。高緯度地區，能量分散，通常較冷。高度也是重要因素，同緯度通常愈高愈冷。教材列出的下降率是近似值，實際大氣仍會隨濕度和天氣條件變化。", "quiz": null}, {"title": "海洋像溫度的緩衝器", "kicker": "03 / 海陸性質與洋流", "points": ["陸地：升溫、降溫較快", "海洋：比熱較大，變化較慢", "暖流增溫；寒流降溫"], "diagram": ["temperature"], "voice": "陸地比熱較小，升溫和降溫較快，氣溫變化較劇烈。海洋比熱較大，變化較慢，所以沿海通常比內陸的溫差小。洋流也會改變沿岸氣溫。臺灣東部有黑潮暖流流經，教材用它解釋部分測站的一月均溫差異。", "quiz": null}, {"title": "氣壓差，推動風的旅程", "kicker": "04 / 高壓與低壓", "points": ["高度增加，上方空氣較少，氣壓降低", "地表風由高壓向低壓流動", "實際風向也受地球自轉等影響"], "diagram": ["pressure"], "voice": "氣壓是單位面積承受的空氣重量。海拔愈高，上方的空氣通常愈少，氣壓愈低。教材以冷暖空氣說明地表高低壓的形成，這是一種簡化模型。氣壓差推動空氣由高壓向低壓移動；實際風向還會受到地球自轉和摩擦影響。", "quiz": null}, {"title": "上升易成雲，下沉多晴朗", "kicker": "05 / 氣旋與反氣旋", "points": ["低壓：近地面輻合，空氣上升", "高壓：空氣下沉，近地面輻散", "北半球低壓逆時針、高壓順時針"], "diagram": ["cyclone"], "voice": "低氣壓中心附近，近地面的風向內輻合，空氣上升，容易冷卻、凝結成雲雨。高氣壓中心附近，空氣下沉，近地面的風向外輻散，通常較晴朗。北半球氣旋逆時針旋轉，反氣旋順時針旋轉。圖中的方向以北半球為例。", "quiz": null}, {"title": "雨量多，還要看怎麼下", "kicker": "06 / 降水特性與災害", "points": ["降水量：累積多少毫米", "降水強度：單位時間下多少", "降水季節：全年、夏雨、冬雨或少雨"], "diagram": ["rainbars"], "voice": "降水是水滴或冰晶從空中落到地面的現象。判讀降水，要看總量、強度和季節。相同總雨量，集中在短時間內，可能造成更大的淹水風險。教材的大雨門檻是二十四小時八十毫米，或一小時四十毫米；其他豪雨分級也依累積雨量判定。", "quiz": null}, {"title": "今年的雨偏離平均多少？", "kicker": "07 / 年降水量變率", "points": ["變率 = |某年 − 平均| ÷ 平均 × 100%", "平均 2,000 mm；某年 1,500 mm", "|1,500 − 2,000| ÷ 2,000 = 25%"], "diagram": ["variation"], "voice": "年降水量變率衡量某一年的雨量偏離長期平均的程度。先算兩者差距的絕對值，再除以平均雨量，乘百分之百。平均兩千毫米，某年一千五百毫米，差五百毫米，變率就是百分之二十五。變率愈大，水資源管理面臨的波動也愈大。", "quiz": null}, {"title": "四種雨，共同點是上升", "kicker": "08 / 降水類型", "points": ["地形雨：沿迎風坡上升", "對流雨：地表受熱，空氣上升", "氣旋雨：螺旋上升；鋒面雨：交會抬升"], "diagram": ["rainTypes"], "voice": "四種降雨類型，重點是空氣為什麼上升。地形雨是潮濕空氣沿山坡爬升；對流雨是地表加熱，空氣上升；氣旋雨隨氣旋活動上升，颱風雨就是例子；鋒面雨則是冷暖氣團交會，暖空氣被抬升。臺灣的梅雨屬於鋒面雨。", "quiz": null}, {"title": "鋒面移動，天氣跟著變", "kicker": "09 / 冷鋒、暖鋒、滯留鋒", "points": ["冷鋒：冷空氣推進，氣溫下降", "暖鋒：暖空氣推進，氣溫升高", "滯留鋒：強度接近，陰雨易持續"], "diagram": ["fronts"], "voice": "冷鋒是冷氣團推進，暖空氣被迫上升，常伴隨降雨、降溫和風力增強。暖鋒是暖氣團推進，通過後氣溫逐漸升高。冷暖氣團勢力接近時，鋒面可能停滯或徘徊，形成滯留鋒，常帶來長時間、範圍廣的降雨。", "quiz": null}, {"title": "臺灣雨很多，為何仍缺水？", "kicker": "10 / 教材生活議題", "points": ["中南部雨量集中夏季", "梅雨、颱風缺席，補水量可能減少", "北部另有冬季東北季風迎風坡降水"], "diagram": ["cycle", "季節分配", "水庫補水", "生活用水"], "voice": "臺灣全年雨量豐富，但季節和地區分布不均。中南部主要雨量集中夏季，梅雨或颱風未帶來足夠降水時，下一個乾季就可能缺水。教材用二〇二一年春季缺水說明這件事。北部迎風地區冬季仍有季風降雨。請判斷梅雨屬於哪種雨型。", "quiz": {"question": "臺灣春夏之交的梅雨，主要屬於哪種降水？", "options": ["地形雨", "鋒面雨", "對流雨"], "answer": 1, "explain": "冷暖氣團交會，暖空氣沿鋒面上升，形成鋒面雨。"}}]};
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(x,y,s,cls='')=>`<text x="${x}" y="${y}" text-anchor="middle" class="${cls}">${esc(s)}</text>`;
const box=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="20" class="panel"/>`;
const arrow=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" class="line flow" marker-end="url(#arrow)"/>`;
const atom=(x,y,label,color='var(--accent)',r=35)=>`<g class="float"><circle cx="${x}" cy="${y}" r="${r}" fill="${color}"/><text x="${x}" y="${y+9}" text-anchor="middle" style="fill:#102529;font-weight:700">${label}</text></g>`;
function diagram(d){let v='';const [kind,...a]=d;
if(kind==='formula'){v=a.map((s,i)=>box(75,30+i*125,650,90)+text(400,87+i*125,s,'big')).join('')+text(400,450,'相同物質 · 不同資訊','label');}
if(kind==='ratio'){v=atom(170,180,a[0])+atom(400,180,a[1])+atom(630,180,a[2])+text(400,340,a[3],'big')+arrow(170,235,310,295)+arrow(630,235,490,295);}
if(kind==='steps'){v=a.map((s,i)=>box(140,10+i*150,520,105)+text(190,78+i*150,String(i+1),'big')+text(440,78+i*150,s)+(i<2?arrow(400,120+i*150,400,150+i*150):'')).join('');}
if(kind==='combustion'){v=box(40,145,180,135)+text(130,195,'樣品')+text(130,237,'燃燒','label')+box(310,145,190,135)+text(405,195,'吸收水')+text(405,237,'Mg(ClO₄)₂','label')+box(590,145,180,135)+text(680,195,'吸收 CO₂')+text(680,237,'NaOH','label')+arrow(225,210,300,210)+arrow(505,210,580,210)+text(400,365,'先水、後二氧化碳','big')+text(400,420,'吸收管增重 → 產物質量','label');}
if(kind==='isomers'){v=text(400,50,'C₂H₆O','big')+box(35,105,730,135)+text(400,157,'CH₃ — CH₂ — OH','big')+text(400,211,'乙醇：氧連在末端','label')+box(35,275,730,135)+text(400,327,'CH₃ — O — CH₃','big')+text(400,381,'甲醚：氧連在兩個碳之間','label');}
if(kind==='functional'){v=['CH₃ | OH','CH₃ | COOH','CH₃ | NH₂'].map((s,i)=>box(70,20+i*145,660,115)+text(310,88+i*145,'CH₃','big')+`<rect x="420" y="${40+i*145}" width="220" height="75" rx="16" fill="var(--accent)"/>`+`<text x="530" y="${88+i*145}" text-anchor="middle" style="fill:#102529;font-size:36px;font-weight:700">${['OH','COOH','NH₂'][i]}</text>`).join('');}

if(kind==='latitude'){v=`<circle cx="650" cy="88" r="52" fill="#ffcb8b" class="float"/><path d="M90 230H720M90 440H720" stroke="#547169" stroke-width="3"/><path d="M600 90 L470 225M560 90 L420 225M520 90 L370 225M600 290 L230 430M560 290 L150 430M520 290 L70 430" class="line flow"/><rect x="365" y="229" width="115" height="12" fill="var(--accent)"/><rect x="65" y="439" width="170" height="12" fill="#ffcb8b"/>`+text(225,140,'低緯度：集中','label')+text(580,380,'高緯度：分散','label');}
if(kind==='temperature'){v=`<path d="M100 60V390H730" stroke="#547169" fill="none" stroke-width="2"/><path d="M100 300Q260 30 410 240T720 320" fill="none" stroke="#ffcb8b" stroke-width="5"/><path d="M100 245Q250 160 410 230T720 265" class="line"/>`+text(365,60,'氣溫變化幅度','label')+text(600,120,'陸地：較大')+text(600,190,'海洋：較小')+text(400,445,'概念示意 · 非測站數據','label');}

if(kind==='transaction'){v=box(35,40,730,110)+text(400,89,'元元 → 小辰：先簽契約')+text(400,125,'5,000 元 · 債權','label')+box(35,195,730,110)+text(400,245,'小辰 → 阿庭：買賣並交付')+text(400,282,'6,000 元 · 取得所有權','label')+arrow(400,155,400,187)+text(400,393,'所有權原則上優先於債權','big')+text(400,455,'元元仍可向小辰主張契約責任','label');}

return `<svg viewBox="0 0 800 510" role="img" aria-label="${esc(lesson.slides[current]?.title||lesson.title)}的視覺化示意"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--accent)"/></marker></defs>${v}</svg>`;}
function chunks(s){let out=[],buf='';for(const c of s){buf+=c;if((/[，。；：？！]/.test(c)&&buf.length>=12)||buf.length>=32){out.push(buf);buf='';}}if(buf)out.push(buf);return out;}
lesson.slides.forEach(s=>{s.captions=chunks(s.voice);let total=s.captions.reduce((a,c)=>a+c.length,0),n=0;s.cues=s.captions.map(c=>{let start=n/total*28;n+=c.length;return {text:c,start,end:n/total*28};});});
let current=-1,t=0,playing=true,last=performance.now(),audio=false,speechCue=-1,utterance=null,speechGeneration=0,visibilityPaused=false;
function cancelVoice(){speechGeneration++;if('speechSynthesis'in window)speechSynthesis.cancel();utterance=null;speechCue=-1;}
function speakSlide(){cancelVoice();if(!audio||!playing)return;if(!('speechSynthesis'in window)){audio=false;$('voiceStatus').textContent='此瀏覽器不支援配音，請使用支援文字轉語音的瀏覽器。';return;}
 const s=lesson.slides[current],local=t-current*30,index=Math.max(0,s.cues.findIndex(c=>c.end>local));let offset=s.captions.slice(0,index).join('').length;const u=new SpeechSynthesisUtterance(s.voice.slice(offset));utterance=u;u.lang='zh-TW';u.rate=1;u.pitch=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^zh[-_]TW/i.test(v.lang)&&v.default)||voices.find(v=>/^zh[-_]TW/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang)&&v.default)||voices.find(v=>/^zh/i.test(v.lang))||null;
 const gen=speechGeneration;u.onboundary=e=>{if(gen!==speechGeneration)return;let n=0;speechCue=s.captions.findIndex(c=>{n+=c.length;return n>offset+e.charIndex;});};u.onend=()=>{if(gen===speechGeneration)speechCue=-1;};u.onerror=e=>{if(gen===speechGeneration&&!['canceled','interrupted'].includes(e.error)){$('voiceStatus').textContent='語音未能播放：'+e.error+'。字幕仍可使用；請確認裝置已安裝中文語音。';speechCue=-1;}};
 $('voiceStatus').textContent='使用 '+(u.voice?u.voice.name:'瀏覽器預設中文語音')+' · 正常語速';speechSynthesis.speak(u);}
function showQuiz(s){let q=s.quiz||{question:'本段小思考：'+s.title,options:['顯示本段重點'],answer:0,explain:s.points.join('；')};$('question').textContent=q.question;$('feedback').textContent='';$('answers').replaceChildren();q.options.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{setPlaying(false);$('feedback').textContent=(s.quiz?(i===q.answer?'答對了。':'再想一想。'):'重點：')+q.explain;};$('answers').append(b);});}
function render(){const idx=Math.min(9,Math.floor(t/30));if(idx!==current){current=idx;const s=lesson.slides[idx];$('slide').innerHTML=`<div class="eyebrow"><span>${esc(lesson.subject)} / VISUAL LESSON</span><span class="number">${String(idx+1).padStart(2,'0')} / 10</span></div><p class="kicker">${esc(s.kicker)}</p><h1>${esc(s.title)}</h1><div class="viz">${diagram(s.diagram)}</div><ul class="points">${s.points.map((p,i)=>`<li class="node" style="animation-delay:${i*.14}s">${esc(p)}</li>`).join('')}</ul><div class="takeaway"><span>教材頁 142–151</span><span>看見關係，理解概念。</span></div>`;$('slide').style.animation='none';void $('slide').offsetWidth;$('slide').style.animation='';$('jump').value=idx;showQuiz(s);speakSlide();}
const local=t-idx*30,s=lesson.slides[idx],cue=speechCue>=0?speechCue:s.cues.findIndex(c=>c.end>local);$('caption').textContent=s.captions[cue<0?s.captions.length-1:cue];$('seek').value=t;$('time').textContent=fmt(t)+' / 05:00';$('filmTime').textContent=fmt(t);$('progress').style.width=t/3+'%';$('ended').style.display=t>=300?'grid':'none';}
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');
function setPlaying(p){playing=p;last=performance.now();$('play').textContent=p?'暫停':'播放';$('state').textContent=p?'自動播放中':'已暫停';$('frame').classList.toggle('paused',!p);if(!p)cancelVoice();else speakSlide();}
function seekTo(v){cancelVoice();t=Math.max(0,Math.min(300,v));current=-1;last=performance.now();render();}
$('play').onclick=()=>{if(t>=300){t=0;current=-1;render();}setPlaying(!playing);};$('voice').onclick=()=>{audio=!audio;$('voice').textContent=audio?'關閉旁白':'開啟旁白';if(audio){seekTo(current*30);setPlaying(true);}else{cancelVoice();$('voiceStatus').textContent='旁白已關閉，畫面與字幕繼續播放。';}};
function replay(){seekTo(0);setPlaying(true);}$('replay').onclick=replay;$('replayEnd').onclick=replay;
$('seek').oninput=e=>seekTo(Number(e.target.value));$('jump').onchange=e=>seekTo(Number(e.target.value)*30);$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('state').textContent='此裝置不支援全螢幕';}};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON|TEXTAREA|SUMMARY/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}if(e.code==='ArrowRight')seekTo(Math.min(270,(current+1)*30));if(e.code==='ArrowLeft')seekTo(Math.max(0,(current-1)*30));});
document.addEventListener('visibilitychange',()=>{if(document.hidden){visibilityPaused=playing;if(playing)setPlaying(false);}else if(visibilityPaused){visibilityPaused=false;setPlaying(true);}});
$('jump').innerHTML=lesson.slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</option>`).join('');
$('transcript').innerHTML=lesson.slides.map((s,i)=>`<h3>${fmt(i*30)}–${fmt((i+1)*30)} ${esc(s.title)}</h3><p>${s.captions.map(esc).join('<br>')}</p>`).join('');
$('download').onclick=()=>{const str=lesson.title+'\n\n'+lesson.slides.map((s,i)=>`${fmt(i*30)}–${fmt((i+1)*30)} ${s.title}\n${s.captions.join('\n')}`).join('\n\n');let url=URL.createObjectURL(new Blob([str],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=lesson.slug+'-逐字稿.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function tick(now){if(playing){t=Math.min(300,t+Math.max(0,now-last)/1000);if(t>=300)setPlaying(false);}last=now;render();requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
window.lessonPlayer={get time(){return t},get playing(){return playing},get slide(){return current},seek:seekTo,pause:()=>setPlaying(false),play:()=>setPlaying(true),lesson};
