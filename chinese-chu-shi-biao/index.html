const lesson={"slug": "chinese-chu-shi-biao", "subject": "國文", "title": "出師表", "accent": "#f4b8a0", "source": "1lJfhjbRBWPMg7XFp3ycJc4sKOzNbBXme", "pages": "教材頁 148–163", "slides": [{"title": "出征之前，先留下叮嚀", "kicker": "01 / 題解與時代背景", "points": ["作者：蜀漢丞相諸葛亮，字孔明", "建興五年（227），北伐前上表劉禪", "表：臣子向君主陳述請求的文體"], "diagram": ["custom", "<svg viewBox=\"0 0 800 510\" role=\"group\" aria-label=\"出征之前，先留下叮嚀\"><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/></marker></defs><path d=\"M95 65V435\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"4\" stroke-linecap=\"round\" class=\"flow\"/><circle cx=\"95\" cy=\"70\" r=\"10\" fill=\"var(--accent)\"/><text x=\"180\" y=\"80\" text-anchor=\"middle\" style=\"font-size:26px;fill:var(--accent);font-weight:700\">207</text><text x=\"490\" y=\"70\" text-anchor=\"middle\" style=\"font-size:29px;fill:var(--ink);font-weight:400\">三顧茅廬</text><text x=\"490\" y=\"112\" text-anchor=\"middle\" style=\"font-size:22px;fill:var(--muted);font-weight:400\">諸葛亮出仕，提出隆中對</text><circle cx=\"95\" cy=\"185\" r=\"10\" fill=\"var(--accent)\"/><text x=\"180\" y=\"195\" text-anchor=\"middle\" style=\"font-size:26px;fill:var(--accent);font-weight:700\">223</text><text x=\"490\" y=\"185\" text-anchor=\"middle\" style=\"font-size:29px;fill:var(--ink);font-weight:400\">劉備逝世</text><text x=\"490\" y=\"227\" text-anchor=\"middle\" style=\"font-size:22px;fill:var(--muted);font-weight:400\">後主劉禪繼位</text><circle cx=\"95\" cy=\"300\" r=\"10\" fill=\"var(--accent)\"/><text x=\"180\" y=\"310\" text-anchor=\"middle\" style=\"font-size:26px;fill:var(--accent);font-weight:700\">227</text><text x=\"490\" y=\"300\" text-anchor=\"middle\" style=\"font-size:29px;fill:var(--ink);font-weight:400\">北伐前上表</text><text x=\"490\" y=\"342\" text-anchor=\"middle\" style=\"font-size:22px;fill:var(--muted);font-weight:400\">規諫後主，表明忠誠</text></svg>"], "voice": "出師表是諸葛亮在建興五年，也就是西元二二七年，北伐前寫給後主劉禪的奏表。表，是臣子向君主陳述請求的文體。文章不只交代出征，也安排留守治理、勸諫後主，並回顧先帝恩遇。讀懂出征前的憂慮，才能理解全文的情與理。", "quiz": null, "explore": null}, {"title": "危急之中，仍有可用的力量", "kicker": "02 / 開篇：審視國勢", "points": ["「先帝創業未半，而中道崩殂」", "「今天下三分，益州疲弊」", "但侍衛之臣不懈，忠志之士忘身"], "diagram": ["custom", "<svg viewBox=\"0 0 800 510\" role=\"group\" aria-label=\"危急之中，仍有可用的力量\"><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/></marker></defs><rect x=\"250\" y=\"25\" width=\"510\" height=\"145\" rx=\"18\" class=\"panel\"/><text x=\"505\" y=\"85\" text-anchor=\"middle\" style=\"font-size:48px;fill:var(--accent);font-weight:700\">魏</text><text x=\"505\" y=\"133\" text-anchor=\"middle\" style=\"font-size:23px;fill:var(--muted);font-weight:400\">北方勢力</text><rect x=\"35\" y=\"230\" width=\"345\" height=\"180\" rx=\"18\" class=\"panel\"/><text x=\"208\" y=\"292\" text-anchor=\"middle\" style=\"font-size:44px;fill:var(--accent);font-weight:700\">蜀漢</text><text x=\"208\" y=\"355\" text-anchor=\"middle\" style=\"font-size:25px;fill:var(--ink);font-weight:400\">益州疲弊</text><rect x=\"430\" y=\"230\" width=\"330\" height=\"180\" rx=\"18\" class=\"panel\"/><text x=\"595\" y=\"292\" text-anchor=\"middle\" style=\"font-size:44px;fill:var(--accent);font-weight:700\">吳</text><text x=\"595\" y=\"355\" text-anchor=\"middle\" style=\"font-size:25px;fill:var(--ink);font-weight:400\">東南勢力</text><path d=\"M230 218L350 177\" class=\"line flow\" marker-end=\"url(#arrow)\"/><text x=\"400\" y=\"475\" text-anchor=\"middle\" style=\"font-size:22px;fill:var(--muted);font-weight:400\">位置僅為概念示意，非疆界圖</text></svg>"], "voice": "開篇先指出三項危機：先帝事業尚未完成便逝世，天下分成三國，蜀漢人力和財力困乏。然而，朝中臣子仍勤勉，外面的將士仍捨身效命。作者先寫危，再寫可用之力，提醒後主不能消沉。危急存亡之秋的秋，是時候，不是秋天。", "quiz": {"question": "「危急存亡之秋」的「秋」意為？", "options": ["秋季", "時候、關頭", "衰老"], "answer": 1, "explain": "秋在此指時候；全句說明這是生死存亡的緊要關頭。"}, "explore": null}, {"title": "第一諫：把忠言聽進來", "kicker": "03 / 廣開言路", " if(kind==='rainbars'){v=['大雨','豪雨','大豪雨','超大豪雨'].map((s,i)=>box(90,25+i*110,620,80)+`<rect x="95" y="${30+i*110}" height="70" width="${[85,210,365,520][i]}" rx="14" fill="var(--accent)" opacity=".25"/>`+text(230,77+i*110,s)+text(560,77+i*110,[80,200,350,500][i]+' mm')).join('')+text(400,490,'24 小時門檻；另有短延時門檻','label');}

if(kind==='rainTypes'){v=[['地形雨','山坡'],['對流雨','受熱'],['氣旋雨','低壓'],['鋒面雨','交會']].map(([s,t],i)=>{let x=20+(i%2)*400,y=20+Math.floor(i/2)*245;return box(x,y,365,220)+text(x+183,y+45,s)+`<path d="M${x+70} ${y+170}l70 -55 75 55" stroke="#6c8d78" stroke-width="4" fill="none"/>`+arrow(x+230,y+175,x+230,y+90)+text(x+120,y+205,t,'label')+`<path d="M${x+250} ${y+65}v65M${x+275} ${y+65}v65" class="rain"/>`}).join('');}
if(kind==='fronts'){v=['冷鋒：冷推暖','暖鋒：暖推冷','滯留鋒：徘徊'].map((s,i)=>box(45,15+i*160,710,135)+text(230,72+i*160,s)+`<path d="M450 ${55+i*160} L610 ${110+i*160} L735 ${110+i*160}" fill="none" stroke="${i===0?'#6edfe9':'#ffcb8b'}" stroke-width="8"/>`+arrow(i===1?725:465,35+i*160,i===1?630:570,35+i*160)).join('');}
if(kind==='ownership'){v=`<circle cx="400" cy="230" r="165" fill="none" stroke="#547169" stroke-dasharray="4 15" stroke-width="3"/><rect x="315" y="170" width="170" height="110" rx="15" class="panel"/><path d="M295 300H505" class="line"/>`+text(400,237,'所有物')+text(400,50,'使用','big')+text(160,370,'收益','big')+text(640,370,'處分','big')+arrow(400,95,400,150)+arrow(265,355,315,280)+arrow(535,355,485,280);}
if(kind==='classification'){v=box(50,30,700,95)+text(400,91,'人 → 享有權利的主體','big')+box(50,190,320,235)+box(430,190,320,235)+text(210,252,'不動產')+text(210,315,'土地・房屋','label')+text(590,252,'動產')+text(590,315,'手機・衣服','label')+arrow(300,140,210,180)+arrow(500,140,590,180);}
if(kind==='shield'){v=`<path d="M400 35L620 110V240Q620 370 400 455Q180 370 180 240V110Z" fill="var(--accent)" opacity=".1" stroke="var(--accent)" stroke-width="4"/><path d="M295 245L370 320L515 160" class="line flow" stroke-width="12"/>`+text(400,395,'依法主張權利','label');}
if(kind==='transaction'){v=box(35,40,730,110)+text(400,89,'元元 → 小辰：先簽契約')+text(400,125,'5,000 元 · 債權','label')+box(35,195,730,110)+text(400,245,'小辰 → 阿庭：買賣並交付')+text(400,282,'6,000 元 · 取得所有權','label')+arrow(400,155,400,187)+text(400,393,'所有權原則上優先於債權','big')+text(400,455,'元元仍可向小辰主張契約責任','label');}

if(kind==='balance'){v=`<path d="M400 110V395M280 395H520M130 155H670M210 155L135 300H285ZM590 155L515 300H665Z" class="line" fill="none"/><circle cx="400" cy="110" r="16" fill="var(--accent)"/>`+text(210,365,'私有財產')+text(590,365,'公共利益')+text(400,455,'法律與正當程序','big');}
return `<svg viewBox="0 0 800 510" role="img" aria-label="${esc(lesson.slides[current]?.title||lesson.title)}的視覺化示意"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--accent)"/></marker></defs>${v}</svg>`;}
function chunks(s){let out=[],buf='';for(const c of s){buf+=c;if((/[，。；：？！]/.test(c)&&buf.length>=12)||buf.length>=32){out.push(buf);buf='';}}if(buf)out.push(buf);return out;}
lesson.slides.forEach(s=>{s.captions=chunks(s.voice);let total=s.captions.reduce((a,c)=>a+c.length,0),n=0;s.cues=s.captions.map(c=>{let start=n/total*28;n+=c.length;return {text:c,start,end:n/total*28};});});
const reflections={};let current=-1,t=0,playing=true,last=performance.now(),audio=false,speechCue=-1,utterance=null,speechGeneration=0,visibilityPaused=false;
function cancelVoice(){speechGeneration++;if('speechSynthesis'in window)speechSynthesis.cancel();utterance=null;speechCue=-1;}
function speakSlide(){cancelVoice();if(!audio||!playing)return;if(!('speechSynthesis'in window)){audio=false;$('voiceStatus').textContent='此瀏覽器不支援配音，請使用支援文字轉語音的瀏覽器。';return;}
 const s=lesson.slides[current],local=t-current*30,index=Math.max(0,s.cues.findIndex(c=>c.end>local));let offset=s.captions.slice(0,index).join('').length;const u=new SpeechSynthesisUtterance(s.voice.slice(offset));utterance=u;u.lang='zh-TW';u.rate=1;u.pitch=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^zh[-_]TW/i.test(v.lang)&&v.default)||voices.find(v=>/^zh[-_]TW/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang)&&v.default)||voices.find(v=>/^zh/i.test(v.lang))||null;
 const gen=speechGeneration;u.onboundary=e=>{if(gen!==speechGeneration)return;let n=0;speechCue=s.captions.findIndex(c=>{n+=c.length;return n>offset+e.charIndex;});};u.onend=()=>{if(gen===speechGeneration)speechCue=-1;};u.onerror=e=>{if(gen===speechGeneration&&!['canceled','interrupted'].includes(e.error)){$('voiceStatus').textContent='語音未能播放：'+e.error+'。字幕仍可使用；請確認裝置已安裝中文語音。';speechCue=-1;}};
 $('voiceStatus').textContent='使用 '+(u.voice?u.voice.name:'瀏覽器預設中文語音')+' · 正常語速';speechSynthesis.speak(u);}
function showQuiz(s){if(s.explore){const q=s.explore;$('question').textContent=q.question;$('feedback').textContent='';$('answers').replaceChildren();q.choices.forEach((choice,i)=>{const b=document.createElement('button');b.textContent=choice.label;b.setAttribute('aria-pressed','false');b.onclick=()=>{setPlaying(false);$('answers').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');$('feedback').textContent=choice.text;};$('answers').append(b);});const label=document.createElement('label');label.className='reflection-label';label.textContent=q.prompt;label.htmlFor='reflection';const field=document.createElement('textarea');field.id='reflection';field.rows=3;field.placeholder='在這裡寫下你的想法（不會上傳）';field.value=reflections[current]||'';field.onfocus=()=>setPlaying(false);field.oninput=()=>{reflections[current]=field.value;};$('answers').append(label,field);return;}let q=s.quiz||{question:'本段小思考：'+s.title,options:['顯示本段重點'],answer:0,explain:s.points.join('；')};$('question').textContent=q.question;$('feedback').textContent='';$('answers').replaceChildren();q.options.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{setPlaying(false);$('feedback').textContent=(s.quiz?(i===q.answer?'答對了。':'再想一想。'):'重點：')+q.explain;};$('answers').append(b);});}
function render(){const idx=Math.min(9,Math.floor(t/30));if(idx!==current){current=idx;const s=lesson.slides[idx];$('slide').innerHTML=`<div class="eyebrow"><span>${esc(lesson.subject)} / VISUAL LESSON</span><span class="number">${String(idx+1).padStart(2,'0')} / 10</span></div><p class="kicker">${esc(s.kicker)}</p><h1>${esc(s.title)}</h1><div class="viz">${diagram(s.diagram)}</div><ul class="points">${s.points.map((p,i)=>`<li class="node" style="animation-delay:${i*.14}s">${esc(p)}</li>`).join('')}</ul><div class="takeaway"><span>教材頁 148–163</span><span>看見關係，理解概念。</span></div>`;$('slide').style.animation='none';void $('slide').offsetWidth;$('slide').style.animation='';$('jump').value=idx;showQuiz(s);speakSlide();}
const local=t-idx*30,s=lesson.slides[idx],cue=speechCue>=0?speechCue:s.cues.findIndex(c=>c.end>local);$('caption').textContent=s.captions[cue<0?s.captions.length-1:cue];$('seek').value=t;$('time').textContent=fmt(t)+' / 05:00';$('filmTime').textContent=fmt(t);$('progress').style.width=t/3+'%';$('ended').style.display=t>=300?'grid':'none';}
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');
function setPlaying(p){playing=p;last=performance.now();$('play').textContent=p?'暫停':'播放';$('state').textContent=p?'自動播放中':'已暫停';$('frame').classList.toggle('paused',!p);if(!p)cancelVoice();else speakSlide();}
function seekTo(v){cancelVoice();t=Math.max(0,Math.min(300,v));current=-1;last=performance.now();render();}
$('play').onclick=()=>{if(t>=300){t=0;current=-1;render();}setPlaying(!playing);};$('voice').onclick=()=>{audio=!audio;$('voice').textContent=audio?'關閉旁白':'開啟旁白';if(audio){seekTo(current*30);setPlaying(true);}else{cancelVoice();$('voiceStatus').textContent='旁白已關閉，畫面與字幕繼續播放。';}};
function replay(){seekTo(0);setPlaying(true);}$('replay').onclick=replay;$('replayEnd').onclick=replay;
$('seek').oninput=e=>seekTo(Number(e.target.value));$('jump').onchange=e=>seekTo(Number(e.target.value)*30);$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('state').textContent='此裝置不支援全螢幕';}};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON|TEXTAREA|SUMMARY/.test(e.target.tagName)||e.target.closest('[data-choice]'))return;if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}if(e.code==='ArrowRight')seekTo(Math.min(270,(current+1)*30));if(e.code==='ArrowLeft')seekTo(Math.max(0,(current-1)*30));});
document.addEventListener('visibilitychange',()=>{if(document.hidden){visibilityPaused=playing;if(playing)setPlaying(false);}else if(visibilityPaused){visibilityPaused=false;setPlaying(true);}});
$('jump').innerHTML=lesson.slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</option>`).join('');
$('transcript').innerHTML=lesson.slides.map((s,i)=>`<h3>${fmt(i*30)}–${fmt((i+1)*30)} ${esc(s.title)}</h3><p>${s.captions.map(esc).join('<br>')}</p>`).join('');
$('download').onclick=()=>{const str=lesson.title+'\n\n'+lesson.slides.map((s,i)=>`${fmt(i*30)}–${fmt((i+1)*30)} ${s.title}\n${s.captions.join('\n')}`).join('\n\n');let url=URL.createObjectURL(new Blob([str],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=lesson.slug+'-逐字稿.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function tick(now){if(playing){t=Math.min(300,t+Math.max(0,now-last)/1000);if(t>=300)setPlaying(false);}last=now;render();requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
$('slide').addEventListener('click',e=>{const node=e.target.closest('[data-choice]');if(node){const map={0:1,1:0};$('answers').querySelectorAll('button')[map[node.dataset.choice]]?.click();}});$('slide').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const node=e.target.closest('[data-choice]');if(node){e.preventDefault();e.stopPropagation();node.dispatchEvent(new MouseEvent('click',{bubbles:true}));}}});
window.lessonPlayer={get time(){return t},get playing(){return playing},get slide(){return current},seek:seekTo,pause:()=>setPlaying(false),play:()=>setPlaying(true),lesson};
</script></body></html>
