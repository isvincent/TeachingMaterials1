'use strict';
const lesson={"slug": "english-lady-or-tiger", "subject": "英文", "title": "The Lady or the Tiger?", "accent": "#d4b7ff", "source": "17eGY9_nBDNipBVXFvuGfX1WLQ-R3s4sC", "pages": "教材頁 2–25", "slides": [{"title": "兩扇門，一個未解的問題", "kicker": "01 / STORY & READING GOALS", "points": ["故事改編自 Frank Stockton 的作品", "閱讀重點：情節、衝突、作者意圖", "語言重點：字彙、要求句型、讓步句型"], "diagram": ["custom", "<svg viewBox=\"0 0 800 510\" role=\"group\" aria-label=\"兩扇門，一個未解的問題\"><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/></marker></defs><path d=\"M45 435V180Q45 20 400 20Q755 20 755 180V435\" fill=\"none\" stroke=\"#607179\" stroke-width=\"4\" stroke-linecap=\"round\" class=\"\"/><g class=\"door\"><path d=\"M170 400V160a80 80 0 0 1 160 0V400Z\" class=\"panel\"/><path d=\"M250 110V395\" stroke=\"#5a6975\"/><circle cx=\"300\" cy=\"280\" r=\"7\" fill=\"var(--accent)\"/><text x=\"250\" y=\"235\" text-anchor=\"middle\" style=\"font-size:65px;fill:var(--accent);font-weight:400\">?</text></g><g class=\"door\"><path d=\"M475 400V160a80 80 0 0 1 160 0V400Z\" class=\"panel\"/><path d=\"M555 110V395\" stroke=\"#5a6975\"/><circle cx=\"605\" cy=\"280\" r=\"7\" fill=\"var(--accent)\"/><text x=\"555\" y=\"235\" text-anchor=\"middle\" style=\"font-size:65px;fill:var(--accent);font-weight:400\">?</text></g><text x=\"250\" y=\"451\" text-anchor=\"middle\" style=\"font-size:23px;fill:var(--ink);font-weight:400\">DOOR A</text><text x=\"555\" y=\"451\" text-anchor=\"middle\" style=\"font-size:23px;fill:var(--ink);font-weight:400\">DOOR B</text><text x=\"400\" y=\"495\" text-anchor=\"middle\" style=\"font-size:23px;fill:var(--muted);font-weight:400\">看似相同，命運不同</text></svg>"], "voice": "這一課從兩扇一模一樣的門開始。一扇門後是老虎，另一扇門後是女子。故事改編自法蘭克史托克頓的作品。我們會先理解人物的衝突，再讀懂作者留下懸念的目的，最後練習教材中的字彙、句型，以及表達同意和不同意的方法。", "quiz": null, "explore": null}, {"title": "國王把審判交給命運", "kicker": "02 / THE KING’S “JUSTICE”", "points": ["國王不用證據判定有罪或無罪", "老虎：死亡；女子：獲准與她結婚", "對比線索：while、on the other hand"], "diagram": ["custom", "<svg viewBox=\"0 0 800 510\" role=\"group\" aria-label=\"國王把審判交給命運\"><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/></marker></defs><rect x=\"45\" y=\"25\" width=\"710\" height=\"115\" rx=\"18\" class=\"panel\"/><text x=\"400\" y=\"76\" text-anchor=\"middle\" style=\"font-size:34px;fill:var(--accent);font-weight:700\">Evidence ✕</text><text x=\"400\" y=\"117\" text-anchor=\"middle\" style=\"font-size:23px;fill:var(--muted);font-weight:400\">國王不依靠證據</text><rect x=\"45\" y=\"170\" width=\"710\" height=\"115\" rx=\"18\" class=\"panel\"/><text x=\"400\" y=\"221\" text-anchor=\"middle\" style=\"font-size:34px;fill:var(--accent);font-weight:700\">Tiger / Lady</text><text x=\"400\" y=\"262\" text-anchor=\"middle\" style=\"font-size:23px;fill:var(--muted);font-weight:400\">死亡 / 與女子結婚</text><rect x=\"45\" y=\"315\" width=\"710\" height=\"115\" rx=\"18\" class=\"panel\"/><text x=\"400\" y=\"366\" text-anchor=\"middle\" style=\"font-size:34px;fill:var(--accent);font-weight:700\">Fate ≠ a fair trial</text><text x=\"400\" y=\"407\" text-anchor=\"middle\" style=\"font-size:23px;fill:var(--muted);font-weight:400\">故事中的制度值得質疑</text></svg>"], "voice": "國王聲稱神會決定嫌疑人的命運，因此不靠證據，而要求嫌疑人公開選門。選到老虎就死亡，選到女子就獲准與她結婚。教材用這個殘酷制度引出正義的問題。閱讀時，注意表示對比的連接語：它們讓死亡和婚姻兩種結果形成鮮明對照。", "quiz": {"question": "國王依據什麼判定嫌疑人的命運？", "options": ["蒐集的證據", "他所相信的神意", "陪審團的討論"], "answer": 1, "explain": "他相信神意引導選門；這是故事設定，並非公平審判的原則。"}, "explore": null}, {"title": "愛情遇上身分的界線", "kicker": "03 / CHARACTER CONFLICT", "points": ["公主與青年相愛，戀情卻被發現", "青年英俊正直，但社會地位低", "國王下令將青年關進監獄，等待審判"], "diagram": ["custom", "<svg viewBox=\"0 0 800 510\" role=\"group\" aria-label=\"愛情遇上身分的界線\"><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/></marker></defs><circle cx=\"400\" cy=\"60\" r=\"27\" fill=\"var(--accent)\"/><path d=\"M355 160V125Q355 90 400 90Q445 90 445 125V160Z\" fill=\"var(--accent)\" opacity=\".3\"/><text x=\"400\" y=\"202\" text-anchor=\"middle\" style=\"font-size:25px;fill:var(--ink);font-weight:400\">公主</text><circle cx=\"170\" cy=\"295\" r=\"27\" fill=\"var(--accent)\"/><path d=\"M125 395V360Q125 325 170 325Q215 325 215 360V395Z\" fill=\"var(--accent)\" opacity=\".3\"/><text x=\"170\" y=\"437\" text-anchor=\"middle\" style=\"font-size:25px;fill:var(--ink);font-weight:400\">戀人</text><circle cx=\"630\" cy=\"295\" r=\"27\" fill=\"#f6c786\"/><path d=\"M585 395V360Q585 325 630 325Q675 325 675 360V395Z\" fill=\"#f6c786\" opacity=\".3\"/><text x=\"630\" y=\"437\" text-anchor=\"middle\" style=\"font-size:25px;fill:var(--ink);font-weight:400\">國王</text><path d=\"M330 165L220 295\" class=\"line flow\" marker-end=\"url(#arrow)\"/><path d=\"M580 295L450 165\" class=\"line flow\" marker-end=\"url(#arrow)\"/><path d=\"M270 365H530\" fill=\"none\" stroke=\"#f6c786\" stroke-width=\"4\" stroke-linecap=\"round\" class=\"flow\"/><text x=\"400\" y=\"300\" text-anchor=\"middle\" style=\"font-size:23px;fill:var(--muted);font-weight:400\">love / status</text></svg>"], "voice": "公主與青年相愛，但青年的社會地位很低，國王不認為他配得上公主。戀情被發現後，青年被關進監獄，等待審判。這裡有兩層衝突：戀人對抗王權和身分限制，以及公主面對即將失去愛人的恐懼。人物性格和制度共同推動情節。", "quiz": null, "explore": null}, {"title": "活下來，卻可能不再屬於她", "kicker": "04 / THE PRINCESS’S DILEMMA", "points": ["老虎：她不願戀人喪命", "女子：她無法忍受戀人另娶他人", "dilemma：每個選項都難以接受"], "diagram": ["custom", "<svg viewBox=\"0 0 800 510\" role=\"group\" aria-label=\"活下來，卻可能不再屬於她\"><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/></marker></defs><rect x=\"250\" y=\"25\" width=\"300\" height=\"90\" rx=\"18\" class=\"panel\"/><text x=\"400\" y=\"83\" text-anchor=\"middle\" style=\"font-size:36px;fill:var(--accent);font-weight:700\">公主的抉擇</text><path d=\"M330 120L205 220\" class=\"line flow\" marker-end=\"url(#arrow)\"/><path d=\"M470 120L595 220\" class=\"line flow\" marker-end=\"url(#arrow)\"/><g data-choice=\"0\" tabindex=\"0\" role=\"button\" aria-label=\"選擇老虎的解讀\"><rect x=\"35\" y=\"225\" width=\"330\" height=\"210\" rx=\"18\" class=\"panel\"/></g><g data-choice=\"1\" tabindex=\"0\" role=\"button\" aria-label=\"選擇女子的解讀\"><rect x=\"435\" y=\"225\" width=\"330\" height=\"210\" rx=\"18\" class=\"panel\"/></g><text x=\"200\" y=\"290\" text-anchor=\"middle\" style=\"font-size:30px;fill:var(--accent);font-weight:700\">THE TIGER</text><text x=\"200\" y=\"350\" text-anchor=\"middle\" style=\"font-size:24px;fill:var(--ink);font-weight:400\">失去戀人的生命</text><text x=\"600\" y=\"290\" text-anchor=\"middle\" style=\"font-size:30px;fill:var(--accent);font-weight:700\">THE LADY</text><text x=\"600\" y=\"350\" text-anchor=\"middle\" style=\"font-size:24px;fill:var(--ink);font-weight:400\">戀人與他人結婚</text><text x=\"400\" y=\"490\" text-anchor=\"middle\" style=\"font-size:26px;fill:var(--muted);font-weight:400\">dilemma：點選結果，提出解讀</text></svg>"], "voice": "公主陷入兩難。她不願戀人被老虎傷害，卻也無法忍受他與另一名女子結婚。她用不易察覺的手勢指示一扇門，青年依她的暗示走近。重點不是猜出唯一答案，而是思考愛、嫉妒和自我犧牲如何拉扯。請用文本線索支持你對公主的判斷。", "quiz": null, "explore": {"question": "如果你是公主，你會希望哪種結果？", "choices": [{"label": "戀人活下來，與女子結婚", "text": "這種解讀重視愛與自我犧牲。可引用「她不願戀人被野獸撕裂」作為線索；但不能據此宣稱原文已揭曉結果。"}, {"label": "嫉妒壓過愛，選擇老虎", "text": "這種解讀重視嫉妒與佔有。可引用「她不能忍受他娶別人」作為線索；原文仍未證實她指向老虎。"}], "prompt": "寫一句理由：我認為……，因為文本提到……。"}}, {"title": "沒有揭曉，也是有意的結局", "kicker": "05 / FOUR KINDS OF ENDINGS", "points": ["本篇為 Unresolved Ending：開放式結局", "結尾停在開門之前，結果未被說明", "教材另載 Moffitt 改寫，並非原作答案"], "diagram": ["custom", "<svg viewBox=\"0 0 800 510\" role=\"group\" aria-label=\"沒有揭曉，也是有意的結局\"><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/></marker></defs><rect x=\"25\" y=\"25\" widt const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(x,y,s,cls='')=>`<text x="${x}" y="${y}" text-anchor="middle" class="${cls}">${esc(s)}</text>`;
const box=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="20" class="panel"/>`;
const arrow=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" class="line flow" marker-end="url(#arrow)"/>`;
const atom=(x,y,label,color='var(--accent)',r=35)=>`<g class="float"><circle cx="${x}" cy="${y}" r="${r}" fill="${color}"/><text x="${x}" y="${y+9}" text-anchor="middle" style="fill:#102529;font-weight:700">${label}</text></g>`;

if(kind==='steps'){v=a.map((s,i)=>box(140,10+i*150,520,105)+text(190,78+i*150,String(i+1),'big')+text(440,78+i*150,s)+(i<2?arrow(400,120+i*150,400,150+i*150):'')).join('');}

function chunks(s){let out=[],buf='';for(const c of s){buf+=c;if((/[，。；：？！]/.test(c)&&buf.length>=12)||buf.length>=32){out.push(buf);buf='';}}if(buf)out.push(buf);return out;}

const reflections={};let current=-1,t=0,playing=true,last=performance.now(),audio=false,speechCue=-1,utterance=null,speechGeneration=0,visibilityPaused=false;
function cancelVoice(){speechGeneration++;if('speechSynthesis'in window)speechSynthesis.cancel();utterance=null;speechCue=-1;}
function speakSlide(){cancelVoice();if(!audio||!playing)return;if(!('speechSynthesis'in window)){audio=false;$('voiceStatus').textContent='此瀏覽器不支援配音，請使用支援文字轉語音的瀏覽器。';return;}
 const s=lesson.slides[current],local=t-current*30,index=Math.max(0,s.cues.findIndex(c=>c.end>local));let offset=s.captions.slice(0,index).join('').length;const u=new SpeechSynthesisUtterance(s.voice.slice(offset));utterance=u;u.lang='zh-TW';u.rate=1;u.pitch=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^zh[-_]TW/i.test(v.lang)&&v.default)||voices.find(v=>/^zh[-_]TW/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang)&&v.default)||voices.find(v=>/^zh/i.test(v.lang))||null;
 const gen=speechGeneration;u.onboundary=e=>{if(gen!==speechGeneration)return;let n=0;speechCue=s.captions.findIndex(c=>{n+=c.length;return n>offset+e.charIndex;});};u.onend=()=>{if(gen===speechGeneration)speechCue=-1;};u.onerror=e=>{if(gen===speechGeneration&&!['canceled','interrupted'].includes(e.error)){$('voiceStatus').textContent='語音未能播放：'+e.error+'。字幕仍可使用；請確認裝置已安裝中文語音。';speechCue=-1;}};
 $('voiceStatus').textContent='使用 '+(u.voice?u.voice.name:'瀏覽器預設中文語音')+' · 正常語速';speechSynthesis.speak(u);}
function showQuiz(s){if(s.explore){const q=s.explore;$('question').textContent=q.question;$('feedback').textContent='';$('answers').replaceChildren();q.choices.forEach((choice,i)=>{const b=document.createElement('button');b.textContent=choice.label;b.setAttribute('aria-pressed','false');b.onclick=()=>{setPlaying(false);$('answers').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');$('feedback').textContent=choice.text;};$('answers').append(b);});const label=document.createElement('label');label.className='reflection-label';label.textContent=q.prompt;label.htmlFor='reflection';const field=document.createElement('textarea');field.id='reflection';field.rows=3;field.placeholder='在這裡寫下你的想法（不會上傳）';field.value=reflections[current]||'';field.onfocus=()=>setPlaying(false);field.oninput=()=>{reflections[current]=field.value;};$('answers').append(label,field);return;}let q=s.quiz||{question:'本段小思考：'+s.title,options:['顯示本段重點'],answer:0,explain:s.points.join('；')};$('question').textContent=q.question;$('feedback').textContent='';$('answers').replaceChildren();q.options.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{setPlaying(false);$('feedback').textContent=(s.quiz?(i===q.answer?'答對了。':'再想一想。'):'重點：')+q.explain;};$('answers').append(b);});}
function render(){const idx=Math.min(9,Math.floor(t/30));if(idx!==current){current=idx;const s=lesson.slides[idx];$('slide').innerHTML=`<div class="eyebrow"><span>${esc(lesson.subject)} / VISUAL LESSON</span><span class="number">${String(idx+1).padStart(2,'0')} / 10</span></div><p class="kicker">${esc(s.kicker)}</p><h1>${esc(s.title)}</h1><div class="viz">${diagram(s.diagram)}</div><ul class="points">${s.points.map((p,i)=>`<li class="node" style="animation-delay:${i*.14}s">${esc(p)}</li>`).join('')}</ul><div class="takeaway"><span>教材頁 2–25</span><span>看見關係，理解概念。</span></div>`;$('slide').style.animation='none';void $('slide').offsetWidth;$('slide').style.animation='';$('jump').value=idx;showQuiz(s);speakSlide();}
const local=t-idx*30,s=lesson.slides[idx],cue=speechCue>=0?speechCue:s.cues.findIndex(c=>c.end>local);$('caption').textContent=s.captions[cue<0?s.captions.length-1:cue];$('seek').value=t;$('time').textContent=fmt(t)+' / 05:00';$('filmTime').textContent=fmt(t);$('progress').style.width=t/3+'%';$('ended').style.display=t>=300?'grid':'none';}
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0');

$('seek').oninput=e=>seekTo(Number(e.target.value));$('jump').onchange=e=>seekTo(Number(e.target.value)*30);$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('state').textContent='此裝置不支援全螢幕';}};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON|TEXTAREA|SUMMARY/.test(e.target.tagName)||e.target.closest('[data-choice]'))return;if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}if(e.code==='ArrowRight')seekTo(Math.min(270,(current+1)*30));if(e.code==='ArrowLeft')seekTo(Math.max(0,(current-1)*30));});

$('jump').innerHTML=lesson.slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</option>`).join('');
$('transcript').innerHTML=lesson.slides.map((s,i)=>`<h3>${fmt(i*30)}–${fmt((i+1)*30)} ${esc(s.title)}</h3><p>${s.captions.map(esc).join('<br>')}</p>`).join('');
$('download').onclick=()=>{const str=lesson.title+'\n\n'+lesson.slides.map((s,i)=>`${fmt(i*30)}–${fmt((i+1)*30)} ${s.title}\n${s.captions.join('\n')}`).join('\n\n');let url=URL.createObjectURL(new Blob([str],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=lesson.slug+'-逐字稿.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function tick(now){if(playing){t=Math.min(300,t+Math.max(0,now-last)/1000);if(t>=300)setPlaying(false);}last=now;render();requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
$('slide').addEventListener('click',e=>{const node=e.target.closest('[data-choice]');if(node){const map={0:1,1:0};$('answers').querySelectorAll('button')[map[node.dataset.choice]]?.click();}});$('slide').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const node=e.target.closest('[data-choice]');if(node){e.preventDefault();e.stopPropagation();node.dispatchEvent(new MouseEvent('click',{bubbles:true}));}}});
